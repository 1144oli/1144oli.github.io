<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.05"/>
    </pattern>
    <style>
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="630" fill="#0a0a0a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)"/>

  <!-- outer border -->
  <rect x="42" y="42" width="1116" height="546" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- vertical divider -->
  <line x1="830" y1="42" x2="830" y2="588" stroke="#555555" stroke-width="2"/>

  <!-- left column text -->
  <text x="100" y="175" font-size="26" font-weight="bold" fill="#ffffff">cyberoli.uk</text>
  <text x="100" y="260" font-size="68" font-weight="bold" fill="#ffffff">Oli</text>
  <text x="100" y="335" font-size="28" fill="#e0e0e0">Cyber Security Student</text>
  <text x="100" y="402" font-size="24" fill="#cfcfcf">Linux / Homelab / Self-hosting</text>
  <line x1="100" y1="455" x2="650" y2="455" stroke="#888888" stroke-width="2"/>
  <text x="100" y="505" font-size="20" fill="#bbbbbb">Portfolio and technical blog</text>

  <!-- right column glyphs, reading top to bottom: I, L, O -->

  <!-- I (dumbbell / serif I on its side) -->
  <g fill="#ffffff">
    <rect x="933" y="156" width="14" height="47"/>
    <rect x="1000" y="156" width="14" height="47"/>
    <rect x="947" y="172" width="53" height="15"/>
  </g>

  <!-- L (flipped: vertical stroke right, arm bottom-left) -->
  <g fill="#ffffff">
    <rect x="1000" y="296" width="13" height="49"/>
    <rect x="931" y="333" width="82" height="13"/>
  </g>

  <!-- O (ring) -->
  <ellipse cx="974" cy="449" rx="42" ry="28" fill="none" stroke="#ffffff" stroke-width="18"/>
</svg>
